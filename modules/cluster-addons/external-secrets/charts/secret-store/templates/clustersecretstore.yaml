{{- if .Values.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name | quote }}
spec:
  provider:
{{- if eq .Values.clusterSecretStore.backend "azure-key-vault" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "clusterSecretStore.azureKeyVault.vaultUrl is required" .Values.clusterSecretStore.azureKeyVault.vaultUrl | quote }}
      serviceAccountRef:
        name: {{ .Values.clusterSecretStore.serviceAccount.name | quote }}
        namespace: {{ .Values.clusterSecretStore.serviceAccount.namespace | quote }}
{{- else }}
{{- fail (printf "unsupported clusterSecretStore.backend %q (azure-key-vault)" .Values.clusterSecretStore.backend) }}
{{- end }}
{{- end }}
