apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.secretStore.serviceAccount.name | quote }}
  annotations:
    azure.workload.identity/client-id: {{ required "secretStore.serviceAccount.clientId is required" .Values.secretStore.serviceAccount.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "secretStore.serviceAccount.tenantId is required" .Values.secretStore.serviceAccount.tenantId | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name | quote }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "secretStore.azureKeyVault.vaultUrl is required" .Values.secretStore.azureKeyVault.vaultUrl | quote }}
      serviceAccountRef:
        name: {{ .Values.secretStore.serviceAccount.name | quote }}
