{{- with .Values.gateway }}
# One HTTPS listener per hostname, each with its own certificateRefs Secret: a managed listener's
# is filled by its Certificate (certificates.yaml), a customer_supplied listener's is the
# customer's. The Gateway carries no cert-manager annotation, so the gateway-shim issues nothing.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ required "gateway.name is required" .name | quote }}
  namespace: {{ required "gateway.namespace is required" .namespace | quote }}
spec:
  gatewayClassName: {{ required "gateway.className is required" .className | quote }}
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: {{ .name | quote }}
{{- if .infrastructureAnnotations }}
    annotations:
      {{- toYaml .infrastructureAnnotations | nindent 6 }}
{{- end }}
  listeners:
    # Port 80 serves every host: it carries cert-manager's HTTP-01 solver routes and the https
    # redirect route (same namespace); no application route may attach.
    - name: {{ .httpSectionName | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
{{- $routeNamespaces := required "gateway.routeNamespaces is required" .routeNamespaces }}
{{- range (required "gateway.listeners is required" .listeners) }}
    - name: {{ required "gateway.listeners[].name is required" .name | quote }}
      port: 443
      protocol: HTTPS
      hostname: {{ required "gateway.listeners[].hostname is required" .hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ required "gateway.listeners[].secretName is required" .secretName | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml $routeNamespaces | nindent 18 }}
        kinds:
          - kind: HTTPRoute
{{- end }}
---
# Plain HTTP answers 301 to https for every host (the route and the port-80 listener set no
# hostnames). cert-manager's HTTP-01 solver route matches a longer
# path prefix (/.well-known/acme-challenge/<token>), which Gateway API ranks above this "/" match,
# so challenges still reach the solver.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-http-redirect" .name | quote }}
  namespace: {{ .namespace | quote }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .name | quote }}
      sectionName: {{ .httpSectionName | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
