apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name | quote }}
spec:
  acme:
    email: {{ required "clusterIssuer.email is required" .Values.clusterIssuer.email | quote }}
    server: {{ .Values.clusterIssuer.server | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account-key" .Values.clusterIssuer.name | quote }}
    solvers:
{{- if eq .Values.clusterIssuer.solver "http01" }}
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: {{ required "clusterIssuer.httpParentRef.name is required" .Values.clusterIssuer.httpParentRef.name | quote }}
                namespace: {{ required "clusterIssuer.httpParentRef.namespace is required" .Values.clusterIssuer.httpParentRef.namespace | quote }}
                sectionName: {{ required "clusterIssuer.httpParentRef.sectionName is required" .Values.clusterIssuer.httpParentRef.sectionName | quote }}
{{- else if eq .Values.clusterIssuer.solver "dns01-azure" }}
{{- $azure := required "clusterIssuer.dns01Azure is required" .Values.clusterIssuer.dns01Azure }}
{{- /* One solver per zone, selected by dnsZones: cert-manager picks the most specific zone a name sits in. */}}
{{- range (required "clusterIssuer.dns01Azure.hostedZoneNames is required" $azure.hostedZoneNames) }}
      - selector:
          dnsZones:
            - {{ . | quote }}
        dns01:
          azureDNS:
            subscriptionID: {{ required "clusterIssuer.dns01Azure.subscriptionID is required" $azure.subscriptionID | quote }}
            resourceGroupName: {{ required "clusterIssuer.dns01Azure.resourceGroupName is required" $azure.resourceGroupName | quote }}
            hostedZoneName: {{ . | quote }}
            environment: {{ $azure.environment | default "AzurePublicCloud" | quote }}
            managedIdentity:
              clientID: {{ required "clusterIssuer.dns01Azure.clientID is required" $azure.clientID | quote }}
{{- end }}
{{- else }}
{{- fail (printf "unsupported clusterIssuer.solver %q (http01 | dns01-azure)" .Values.clusterIssuer.solver) }}
{{- end }}
