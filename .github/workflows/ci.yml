name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Recovery path for a SHA whose push run was lost or cancelled: without
  # this, the ONLY way to get a run for a commit is another push. A manual
  # run reports the commit's verdict; it does not stand in for the push
  # event, so anything keyed on `workflow_run.event == 'push'` correctly
  # ignores it and no downstream build or publish can be triggered this way.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: fmt / validate / tflint / leak-scan
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.2"

      - name: terraform fmt (check, recursive)
        run: terraform fmt -check -recursive

      - name: terraform validate (every module, stack, example)
        run: |
          set -euo pipefail
          # Validate each leaf directory that contains *.tf files, with the
          # backend disabled and providers from the local mirror — no cloud creds.
          find modules stacks examples -type f -name '*.tf' -print0 \
            | xargs -0 -n1 dirname \
            | sort -u \
            | while read -r dir; do
                echo "::group::validate $dir"
                terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
                terraform -chdir="$dir" validate -no-color
                echo "::endgroup::"
              done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint (recursive)
        run: tflint --recursive --no-color

      # Fail the build if any real secret / state / tfvars slipped into the repo.
      - name: Private-data leak scan
        run: |
          set -euo pipefail
          violations="$(git ls-files \
            | grep -E '\.tfstate($|\.)|(^|/)terraform\.tfvars$|(^|/)[^/]+\.auto\.tfvars$|(^|/)backend\.hcl$' \
            | grep -vE '\.example$' || true)"
          if [ -n "$violations" ]; then
            echo "Tracked files that must never be committed to this public repo:"
            echo "$violations"
            exit 1
          fi
          echo "No state/tfvars/backend secrets tracked. OK."

      # The leak scan above is grep-based, and so is every audit of this tree. A
      # tracked source file carrying a raw NUL is classified BINARY by ripgrep,
      # ugrep and `grep -I` — they skip the whole file and report zero matches,
      # so it is invisible to all of them.
      # Self-contained (node builtins only): no install, nothing to lock.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: 5  # setup-node stalls indefinitely on this fleet; fail loudly instead of masking later steps
        with:
          node-version-file: .node-version

      - name: Every tracked source file is readable by search
        run: node tooling/boundaries/lib/source-readability.mjs
